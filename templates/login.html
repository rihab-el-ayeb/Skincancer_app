{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-5">
        <div class="glass-card p-4 text-white">
            <div class="text-center mb-4">
                <i class="fas fa-microscope fa-3x"></i>
                <h2 class="mt-3">Skin Cancer AI</h2>
                <p class="opacity-75">Login to access the system</p>
            </div>

            <!-- Display error message if login fails -->
            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user"></i> Username</label>
                    <input type="text" name="username" class="form-control bg-transparent text-white border-light" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" name="password" class="form-control bg-transparent text-white border-light" required>
                </div>
                <button type="submit" class="btn btn-custom w-100">Login <i class="fas fa-arrow-right"></i></button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
