{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="glass-card p-4 text-white">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-chalkboard-user"></i> Dashboard</h2>
            <a href="/logout" class="btn btn-outline-light"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
        <p class="mt-2">Welcome back, <strong>{{ session.username }}</strong>!</p>
        <hr class="bg-white">
        <div class="row mt-4">
            <div class="col-md-6 mb-3">
                <div class="stat-card">
                    <i class="fas fa-users fa-2x"></i>
                    <h3 class="mt-2">{{ total_patients }}</h3>
                    <p>Total Patients</p>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="stat-card">
                    <i class="fas fa-exclamation-triangle fa-2x"></i>
                    <h3 class="mt-2">{{ malignant_count }}</h3>
                    <p>Malignant Cases</p>
                </div>
            </div>
        </div>
        <div class="d-grid gap-3 col-8 mx-auto mt-4">
            <a href="/predict" class="btn btn-custom btn-lg"><i class="fas fa-plus-circle"></i> New Analysis</a>
            <a href="/patients" class="btn btn-custom btn-lg"><i class="fas fa-history"></i> Patient History</a>
        </div>
    </div>
</div>
{% endblock %}
