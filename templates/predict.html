{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="glass-card p-4 text-white">
        <h2><i class="fas fa-upload"></i> New Analysis</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control bg-transparent text-white" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control bg-transparent text-white" min="0" max="120" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Lesion Image</label>
                <input type="file" name="image" id="imageInput" class="form-control bg-transparent text-white" accept="image/*" required>
                <img id="imagePreview" class="image-preview d-none" alt="Preview">
            </div>
            <button type="submit" class="btn btn-custom w-100">Analyze <i class="fas fa-microscope"></i></button>
        </form>
    </div>
</div>
{% endblock %}
